name: MCP Registry

on:
  schedule:
    - cron: '41 13 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, such as v0.1.0. Its version must already be live on npm. Leave empty to publish npm's latest version if the registry doesn't have it yet.
        required: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: mcp-registry
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      MCP_PUBLISHER_VERSION: v1.8.9
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Pick the tag, or stop if the registry already has npm's latest version
        id: pick
        run: |
          set -euo pipefail
          if [ -z "$TAG" ]; then
            TAG="v$(npm view @statpad/mcp version)"
            name="$(node -p "require('./server.json').name")"
            status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --retry 3 --connect-timeout 10 --max-time 30 "https://registry.modelcontextprotocol.io/v0/servers/${name/\//%2F}/versions/${TAG#v}")"
            case "$status" in
              200)
                echo "The registry already has ${TAG#v}, npm's latest version."
                echo "skip=true" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
              404)
                echo "The registry doesn't have ${TAG#v} yet, so publishing it."
                ;;
              *)
                echo "The registry answered HTTP $status for ${TAG#v}, so it's unclear whether it has that version. Stopping without publishing." >&2
                exit 1
                ;;
            esac
          fi
          git checkout --quiet "refs/tags/$TAG"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "skip=false" >> "$GITHUB_OUTPUT"
      - name: Check the tag matches server.json and the version is live on npm
        if: steps.pick.outputs.skip == 'false'
        run: |
          set -euo pipefail
          version="$(node -p "require('./server.json').version")"
          test "${TAG#v}" = "$version"
          test "$(node -p "require('./server.json').packages[0].version")" = "$version"
          name="$(node -p "require('./server.json').name")"
          published="$(npm view "@statpad/mcp@$version" mcpName)"
          if [ "$published" != "$name" ]; then
            echo "@statpad/mcp@$version on npm has mcpName '$published', expected '$name'. Approve the staged version on npm first." >&2
            exit 1
          fi
      - if: steps.pick.outputs.skip == 'false'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download and verify mcp-publisher
        if: steps.pick.outputs.skip == 'false'
        run: |
          set -euo pipefail
          archive=mcp-publisher_linux_amd64.tar.gz
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"
      - name: Sign in to the MCP Registry with the workflow's OIDC token
        if: steps.pick.outputs.skip == 'false'
        run: ./mcp-publisher login github-oidc
      - name: Publish server.json
        if: steps.pick.outputs.skip == 'false'
        run: ./mcp-publisher publish
