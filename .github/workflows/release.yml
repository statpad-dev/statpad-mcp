name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Use npm 12, which has npm stage publish
        run: npm install -g npm@12
      - run: npm ci
      - name: Check the tag matches package.json and server.json
        run: |
          version="$(node -p "require('./package.json').version")"
          test "${GITHUB_REF_NAME#v}" = "$version"
          test "$(node -p "require('./server.json').version")" = "$version"
          test "$(node -p "require('./server.json').packages[0].version")" = "$version"
      - name: Refuse to publish with a file dependency
        run: npm run check:deps
      - run: npm run check
      - name: Stage the release on npm for a maintainer to approve
        run: npm stage publish
